<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Happy Agent · Web</title>
<style>
:root{
  --bg:#FFFBE8; --surface:#FFFFFF; --text:#2A2210; --muted:#7A7060;
  --accent:#E8A317; --user:#E8A317; --ai:#F5EDD4; --line:#EDE4CC;
  --tool:#F5F0E0; --error:#C0392B; --done:#2E8B57;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#0A0A0A; --text:#F0F0F0; --muted:#808080;
    --accent:#FFC832; --user:#FFC832; --ai:#141414; --line:#222222;
    --tool:#1A1A1A; --error:#E85866; --done:#4EC98C;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
/* 顶栏 */
header{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:var(--surface);
  border-bottom:1px solid var(--line);z-index:10;
}
header .logo{
  width:32px;height:32px;border-radius:10px;background:var(--user);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:16px;flex:0 0 auto;
}
header .titles{flex:1}
header .title{font-weight:600;font-size:15px}
header .sub{font-size:11px;color:var(--muted);margin-top:1px}
header .dot{width:8px;height:8px;border-radius:50%;background:var(--done);flex:0 0 auto}
header .dot.off{background:var(--muted)}
/* 主区域 */
main{flex:1;overflow-y:auto;padding:12px 16px}
/* 消息 */
.msg{max-width:78%;margin:5px 0;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.user{margin-left:auto;background:var(--user);color:#fff;border-bottom-right-radius:4px}
.msg.ai{margin-right:auto;background:var(--ai);border-bottom-left-radius:4px}
.msg.ai code,.msg.ai pre{background:rgba(0,0,0,.08);padding:2px 5px;border-radius:4px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){.msg.ai code,.msg.ai pre{background:rgba(255,255,255,.08)}}
.msg.tool{
  max-width:100%;margin:3px auto;width:85%;background:var(--tool);
  color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
  border-radius:8px;padding:6px 10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.msg.tool .t-icon{font-size:13px;opacity:.6}
.msg.tool .t-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.tool .t-expand{font-size:10px;opacity:.5}
.msg.tool.expanded .t-text{white-space:pre-wrap;word-break:break-word}
.msg .meta{font-size:10px;opacity:.6;margin-top:5px}
/* 空态 */
.empty{text-align:center;color:var(--muted);margin-top:20vh;font-size:14px;line-height:2}
.empty .star{font-size:40px;display:block;margin-bottom:8px;opacity:.3}
/* 任务控制 */
#controls{
  display:none;align-items:center;gap:8px;justify-content:center;
  padding:6px 16px;background:var(--surface);border-top:1px solid var(--line);
}
#controls .status{font-size:12px;font-weight:600}
#controls button{
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;
}
#controls button:hover{background:var(--tool)}
/* 重新生成 */
#regen{
  display:none;margin:4px auto;width:fit-content;
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:8px;padding:4px 14px;font-size:12px;cursor:pointer;
}
#regen:hover{color:var(--accent);border-color:var(--accent)}
/* 底部 */
footer{
  display:flex;align-items:flex-end;gap:8px;
  padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);
}
#box{
  flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--text);
  border-radius:16px;padding:10px 14px;font-size:14px;max-height:120px;min-height:44px;outline:none;
}
#box:focus{border-color:var(--accent)}
#send{
  flex:0 0 auto;width:44px;height:44px;border:none;border-radius:50%;
  background:var(--accent);color:#000;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
#send:disabled{opacity:.4;cursor:default}
/* 连接状态条 */
#conn{font-size:11px;color:var(--muted);padding:3px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
/* 手机适配 */
@media (max-width:560px){
  .msg{max-width:92%;font-size:13px}
  header{padding:8px 12px}
}
</style>
</head>
<body>
<header>
  <div class="logo">H</div>
  <div class="titles">
    <div class="title">Happy Agent</div>
    <div class="sub" id="modelsub">端侧智能体 · Web</div>
  </div>
  <span class="dot" id="dot"></span>
</header>
<div id="conn">正在连接…</div>
<main id="list">
  <div class="empty" id="empty"><span class="star">✦</span>在这里输入任务<br>支持 Markdown · 工具步骤 · 暂停/继续/取消</div>
</main>
<div id="regen">↻ 重新生成</div>
<div id="controls">
  <span class="status" id="ctrl-status">运行中…</span>
  <button id="btn-pause">暂停</button>
  <button id="btn-resume" style="display:none">继续</button>
  <button id="btn-cancel">取消</button>
</div>
<footer>
  <textarea id="box" rows="1" placeholder="给智能体描述一个任务…"></textarea>
  <button id="send" title="发送">➤</button>
</footer>

<script>
var list=document.getElementById('list'),box=document.getElementById('box'),
    send=document.getElementById('send'),empty=document.getElementById('empty'),
    conn=document.getElementById('conn'),dot=document.getElementById('dot'),
    controls=document.getElementById('controls'),regen=document.getElementById('regen');
var sid='',pollTimer=null,lastUserMsg='';

// 简易 Markdown → HTML（粗体、行内代码、代码块、链接）
function md(src){
  if(!src)return '';
  var s=src.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/```(\w*)\n([\s\S]*?)```/g,function(m,lang,code){return '<pre><code>'+code+'</code></pre>'});
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\*(.+?)\*/g,'<i>$1</i>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent)">$1</a>');
  s=s.replace(/^### (.+)$/gm,'<b style="font-size:15px">$1</b>');
  s=s.replace(/^## (.+)$/gm,'<b style="font-size:16px">$1</b>');
  return s;
}

function addMsg(role, text, extra){
  empty.style.display='none';
  var d=document.createElement('div');
  d.className='msg '+role;
  if(role==='ai'){d.innerHTML=md(text||'');}
  else{d.textContent=text||'';}
  if(extra){var m=document.createElement('div');m.className='meta';m.textContent=extra;d.appendChild(m);}
  list.appendChild(d);
  list.scrollTop=list.scrollHeight;
  return d;
}

function addToolMsg(text){
  empty.style.display='none';
  var d=document.createElement('div');
  d.className='msg tool';
  d.innerHTML='<span class="t-icon">⚙</span><span class="t-text"></span><span class="t-expand">▸</span>';
  d.querySelector('.t-text').textContent=text;
  d.onclick=function(){d.classList.toggle('expanded');d.querySelector('.t-expand').textContent=d.classList.contains('expanded')?'▾':'▸';};
  list.appendChild(d);
  list.scrollTop=list.scrollHeight;
}

// 拉状态
function refreshState(){
  fetch('/api/state').then(function(r){return r.json();}).then(function(o){
    sid=(o.sessions&&o.sessions.length)?o.sessions[0].id:'';
    var key=o.keyConfigured?'':'（未配 Key）';
    document.getElementById('modelsub').textContent=o.provider+' · '+o.model+' '+key;
  }).catch(function(){});
}

// 发任务
function sendText(){
  var p=box.value.trim();
  if(!p)return;
  lastUserMsg=p;
  addMsg('user',p);
  box.value='';autoGrow();
  send.disabled=true;
  regen.style.display='none';
  var d=addMsg('ai','…');
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,sessionId:sid})})
    .then(function(r){return r.json();})
    .then(function(o){
      sid=o.sessionId||sid;
      d.innerHTML=md(o.answer&&o.answer.length?o.answer:'（无内容）');
      d.title=o.statusLabel||'';
      // 显示工具步骤
      if(o.tools&&o.tools.length){o.tools.forEach(function(t){addToolMsg(t);});}
      list.scrollTop=list.scrollHeight;
      if(o.status===2||o.status==='done'){regen.style.display='block';}
      refreshState();
    })
    .catch(function(e){d.textContent='请求失败：'+e;})
    .then(function(){send.disabled=false;});
}

// 任务控制
document.getElementById('btn-pause').onclick=function(){fetch('/api/control',{method:'POST',body:JSON.stringify({action:'pause'})}).then(function(){updateControls();});};
document.getElementById('btn-resume').onclick=function(){fetch('/api/control',{method:'POST',body:JSON.stringify({action:'resume'})}).then(function(){updateControls();});};
document.getElementById('btn-cancel').onclick=function(){fetch('/api/control',{method:'POST',body:JSON.stringify({action:'cancel'})}).then(function(){controls.style.display='none';});};

// 轮询任务状态
function startPoll(){
  if(pollTimer)return;
  pollTimer=setInterval(function(){
    fetch('/api/running').then(function(r){return r.json();}).then(function(o){
      if(o.running){
        controls.style.display='flex';
        document.getElementById('ctrl-status').textContent=o.paused?'已暂停':'运行中 · '+o.steps+' 步';
        document.getElementById('btn-pause').style.display=o.paused?'none':'';
        document.getElementById('btn-resume').style.display=o.paused?'':'none';
      } else {
        controls.style.display='none';
        clearInterval(pollTimer);pollTimer=null;
      }
    }).catch(function(){});
  },1000);
}

// 重新生成
regen.onclick=function(){
  regen.style.display='none';
  if(!lastUserMsg)return;
  var d=addMsg('ai','…');
  fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:lastUserMsg,sessionId:sid,regenerate:true})})
    .then(function(r){return r.json();}).then(function(o){
      sid=o.sessionId||sid;
      d.innerHTML=md(o.answer&&o.answer.length?o.answer:'（无内容）');
      if(o.tools&&o.tools.length){o.tools.forEach(function(t){addToolMsg(t);});}
      list.scrollTop=list.scrollHeight;
      if(o.status===2||o.status==='done')regen.style.display='block';
      refreshState();
    });
};

// UI
function autoGrow(){box.style.height='auto';box.style.height=Math.min(box.scrollHeight,120)+'px';}
send.onclick=sendText;
box.addEventListener('input',autoGrow);
box.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}});

// 连接探测
function probe(){
  fetch('/api/ipinfo').then(function(r){return r.json();}).then(function(o){
    var lan=o.lan?'内网 '+o.lan+':'+o.port:'';
    var pub=o.public?' · 外网 '+o.public+':'+o.port:'';
    conn.textContent='服务运行中'+(lan+pub);
    dot.classList.remove('off');
    startPoll();
  }).catch(function(){
    conn.textContent='无法连接 Happy Agent Web 服务';
    dot.classList.add('off');
  });
}
refreshState();probe();
</script>
</body>
</html>
