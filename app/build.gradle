plugins {
    id 'com.android.application' version '8.5.2'
}

// 发布包签名库：仓库里不提交密码，clone 下来先本地生成一个，build.gradle 自动认
def releaseKeystore = file("../gradle/agenz-release.keystore")

android {
    namespace 'com.agenz.mobile'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.agenz.mobile"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 库存在才绑定签名配置，否则 release 也能用默认签名出包
    if (releaseKeystore.exists()) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword "agen2024"
                keyAlias "agen"
                keyPassword "agen2024"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}
